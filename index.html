<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xd Laka Store</title><style>body{margin:0;background:#090912;color:#fff;font-family:Arial}.wrap{max-width:760px;margin:auto;padding:16px}header{text-align:center;padding:25px;background:linear-gradient(135deg,#27124c,#090912)}h1{color:#b978ff} .card{background:#13131d;border:1px solid #332e45;border-radius:16px;padding:16px;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border-radius:10px;border:1px solid #39354b;background:#090910;color:white}button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;background:#9a55ff;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.item img{width:100%;height:180px;object-fit:cover;border-radius:10px}.price{color:#67e6a1;font-size:21px;font-weight:bold}.del{background:#8c2635}.small{color:#aaa;font-size:13px}</style></head><body><header><h1>xd Laka Store</h1><div>Free Fire ID Sell</div></header><div class="wrap"><section class="card"><h2>➕ ID Post Karo</h2><input id="title" placeholder="ID ka title"><input id="price" type="number" placeholder="Price ₹"><input id="uid" placeholder="Free Fire UID"><textarea id="details" rows="3" placeholder="Bundle / skin / details"></textarea><input id="photo" type="file" accept="image/*" multiple><button onclick="add()">Post ID</button><p class="small">Password, OTP ya login details post mat karo.</p></section><section class="card"><h2>💳 Payment QR</h2><img src="qr.png" style="display:block;max-width:220px;width:100%;margin:auto;border-radius:12px" alt="QR"><p><b>Pay and screenshot send</b></p><p class="small">Apna QR image ko qr.png naam se replace karo.</p></section><h2>🔥 Available IDs</h2><div id="list" class="grid"></div></div><script>const K='xd_laka_posts';let posts=JSON.parse(localStorage.getItem(K)||'[]');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function add(){let title=document.getElementById('title').value.trim(),price=document.getElementById('price').value.trim(),uid=document.getElementById('uid').value.trim(),details=document.getElementById('details').value.trim(),files=[...document.getElementById('photo').files];if(!title||!price)return alert('Title aur price bharo.');let imgs=[];if(!files.length)finish();else{let n=files.length;files.forEach(f=>{let r=new FileReader();r.onload=e=>{imgs.push(e.target.result);if(!--n)finish()};r.readAsDataURL(f)})}function finish(){posts.unshift({id:Date.now(),title,price,uid,details,imgs});localStorage.setItem(K,JSON.stringify(posts));document.querySelectorAll('input,textarea').forEach(x=>x.value='');render()}}function removePost(id){if(confirm('Is post ko delete kare?')){posts=posts.filter(p=>p.id!==id);localStorage.setItem(K,JSON.stringify(posts));render()}}function render(){let l=document.getElementById('list');if(!posts.length){l.innerHTML='<div class="card">Abhi koi ID post nahi hai.</div>';return}l.innerHTML=posts.map(p=>`<article class="card item">${p.imgs?.[0]?`<img src="${p.imgs[0]}">`:''}<h3>${esc(p.title)}</h3><div class="price">₹${esc(p.price)}</div>${p.uid?`<div>UID: ${esc(p.uid)}</div>`:''}<p class="small">${esc(p.details)}</p><a href="https://wa.me/?text=${encodeURIComponent('I want this Free Fire ID: '+p.title+' - ₹'+p.price)}"><button>WhatsApp</button></a> <button class="del" onclick="removePost(${p.id})">Delete</button></article>`).join('')}render();</script></body></html>
