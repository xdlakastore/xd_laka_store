<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xd Laka Store</title>

<style>
body{margin:0;background:#090912;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}
header{text-align:center;padding:25px;background:linear-gradient(135deg,#27124c,#090912)}
h1{color:#b978ff;margin:0 0 8px}
.card{background:#13131d;border:1px solid #332e45;border-radius:16px;padding:16px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.item img{width:100%;height:220px;object-fit:cover;border-radius:10px}
.price{color:#67e6a1;font-size:22px;font-weight:bold;margin:10px 0}
.badge{display:inline-block;background:#29233a;padding:6px 10px;border-radius:8px;margin:3px}
.sold{background:#8b1e2d;color:#fff;padding:10px;border-radius:10px;text-align:center;font-weight:bold}
button{border:0;border-radius:10px;padding:13px;color:#fff;font-weight:bold;width:100%;margin-top:10px}
.buy{background:#20b95a}
.wa{background:#20b95a}
.qr{display:block;width:100%;max-width:300px;margin:15px auto;border-radius:12px}
.small{color:#aaa}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>xd Laka Store</h1>
<div>Free Fire ID Sell</div>
</header>

<div class="wrap">

<h2>🔥 Available IDs</h2>
<div id="list"></div>

<section id="payment" class="card hidden">

<h2>💳 Payment करें</h2>

<div id="selected"></div>

<img src="qr.png" class="qr" alt="Payment QR">

<p><b>QR scan करके payment करें।</b></p>

<p class="small">
Payment के बाद WhatsApp पर screenshot भेजें।
</p>

<button id="whatsappBtn" class="wa">
📲 WhatsApp पर Payment भेजें
</button>

</section>

</div>

<script>

const WHATSAPP_NUMBER="917978404391";

/* =================================================
   👇 सिर्फ इसी जगह अपनी IDs डालनी हैं
   ================================================= */

const posts=[

{
postId:"001",
photo:"", 
price:"100",
uid:"123456789",
details:"Rare bundle, Jujutsu Kaisen, Naruto, emotes",
sold:false
},

{
postId:"002",
photo:"",
price:"150",
uid:"987654321",
details:"Rare skins, bundles and emotes",
sold:false
}

/* नई ID ऐसे जोड़ना:
,
{
postId:"003",
photo:"",
price:"500",
uid:"111111111",
details:"New account details",
sold:false
}
*/

];

/* ================================================= */

function esc(x){
return String(x||"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function render(){

let html="";

posts.forEach((p,i)=>{

html+=`<div class="card item">`;

if(p.photo){
html+=`<img src="${esc(p.photo)}">`;
}

html+=`
<div>
<span class="badge">Post ID: ${esc(p.postId)}</span>
</div>

<h2>Free Fire ID</h2>

<div class="price">₹${esc(p.price)}</div>

<div>UID: ${esc(p.uid)}</div>

<p class="small">${esc(p.details)}</p>
`;

if(p.sold){

html+=`<div class="sold">🔴 SOLD OUT</div>`;

}else{

html+=`
<button class="buy" onclick="buy(${i})">
🛒 Buy Now
</button>
`;

}

html+=`</div>`;

});

document.getElementById("list").innerHTML=html;

}

function buy(i){

let p=posts[i];

document.getElementById("payment").classList.remove("hidden");

document.getElementById("selected").innerHTML=`
<div class="badge">Post ID: ${esc(p.postId)}</div>
<h2>Free Fire ID</h2>
<div class="price">₹${esc(p.price)}</div>
<div>UID: ${esc(p.uid)}</div>
`;

document.getElementById("whatsappBtn").onclick=function(){

let msg=
"Hello xd Laka Store 👋\n\n"+
"Main Free Fire ID buy kar raha hoon.\n\n"+
"Post ID: "+p.postId+"\n"+
"UID: "+p.uid+"\n"+
"Price: ₹"+p.price+"\n\n"+
"Payment kar diya hai. Screenshot bhej raha hoon.\n"+
"Please payment verify karke ID details bhej dijiye.";

window.open(
"https://wa.me/"+WHATSAPP_NUMBER+
"?text="+encodeURIComponent(msg),
"_blank"
);

};

document.getElementById("payment")
.scrollIntoView({behavior:"smooth"});

}

render();

</script>

</body>
</html>
